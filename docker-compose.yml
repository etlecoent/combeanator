services:
  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: combeanator-frontend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    networks:
      - combeanator-network
    stdin_open: true
    tty: true

  # Backend - Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: combeanator-backend
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    networks:
      - combeanator-network
    stdin_open: true
    tty: true

  # Redis - Job queue
  redis:
    image: redis:7-alpine
    container_name: combeanator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - combeanator-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: combeanator-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=combeanator
      - POSTGRES_PASSWORD=combeanator
      - POSTGRES_DB=combeanator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - combeanator-network

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
  backend-node-modules:

networks:
  combeanator-network:
    driver: bridge
